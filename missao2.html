<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Missão II: Campo Minado — Taberna dos Bits</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="jogos.css" />
</head>
<body>

  <div class="bg-pixels" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>

  <main class="scroll-container game-scroll">
    
    <!-- Voltar para o mural -->
    <div class="btn-back-wrap">
      <a href="missoes.html" class="btn-back">◀ MURAL DE MISSÕES</a>
    </div>

    <header class="tavern-header">
      <div class="tavern-icon">💣</div>
      <h1 class="tavern-title">CAMPO<br/>MINADO</h1>
      <div class="tavern-subtitle">— Missão II —</div>
    </header>

    <!-- Barra de Status -->
    <div class="game-status-bar">
      <div>
        <span class="status-label">MINAS:</span>
        <span id="mines-count" class="status-value">5</span>
      </div>
      <div>
        <span class="status-label">TEMPO:</span>
        <span id="game-timer" class="status-value">0s</span>
      </div>
    </div>

    <!-- Área de Jogo (Taboleiro) -->
    <div style="position: relative; margin-bottom: 20px;">
      <div class="mines-grid" id="mines-grid">
        <!-- Células geradas dinamicamente via JS -->
      </div>

      <!-- Overlay cobrindo o grid em caso de vitória/derrota/início -->
      <div class="board-overlay" id="board-overlay" style="display: flex;">
        <h2 class="overlay-title" id="overlay-title">[ MISSÃO PERIGOSA! ]</h2>
        <p class="overlay-desc" id="overlay-desc">
          Revele as células seguras na grade 5x5. Cuidado com as 5 minas ocultas!
        </p>
        <button class="btn-primary" id="btn-start" onclick="iniciarJogo()">
          ⚔ ENTRAR NO CAMPO
        </button>
      </div>
    </div>

    <!-- Controles -->
    <div class="mines-controls">
      <button class="btn-restart" id="btn-restart" onclick="reiniciarJogo()" style="display: none;">
        🔄 REINICIAR
      </button>
    </div>

    <!-- Toast de Feedback -->
    <div id="toast" class="toast" role="alert" aria-live="polite"></div>

    <footer class="tavern-footer">
      ⚙ Taberna dos Bits v1.0 · Powered by Supabase
    </footer>

  </main>

  <!-- CDNs e Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabaseClient.js?v=2"></script>
  <script src="missao2.js?v=2"></script>
</body>
</html>
