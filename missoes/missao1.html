<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Missão I: Clique Frenético — Taberna dos Bits</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="jogos.css" />
</head>
<body>

  <div class="bg-pixels" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>

  <main class="scroll-container game-scroll">
    
    <!-- Botão de Placar Rápido -->
    <button class="btn-mini-leaderboard" onclick="abrirPlacarPopup()" title="Ver Placar desta Missão">👑</button>
    
    <!-- Voltar para o mural -->
    <div class="btn-back-wrap">
      <a href="../missoes.html" class="btn-back">◀ MURAL DE MISSÕES</a>
    </div>

    <header class="tavern-header">
      <div class="tavern-icon">🎯</div>
      <h1 class="tavern-title">CLIQUE<br/>FRENÉTICO</h1>
      <div class="tavern-subtitle">— Missão I —</div>
    </header>

    <!-- Barra de Status -->
    <div class="game-status-bar">
      <div>
        <span class="status-label">PONTOS:</span>
        <span id="game-score" class="status-value">0</span>
      </div>
      <div>
        <span class="status-label">TEMPO:</span>
        <span id="game-timer" class="status-value">30s</span>
      </div>
    </div>

    <!-- Área do Jogo -->
    <div class="game-board" id="game-board">
      
      <!-- Overlay de Inicialização / Finalização -->
      <div class="board-overlay" id="board-overlay">
        <h2 class="overlay-title" id="overlay-title">[ PREPARE-SE, HERÓI! ]</h2>
        <p class="overlay-desc" id="overlay-desc">
          Acerte o máximo de moedas douradas que puder antes que o tempo acabe.
        </p>
        <button class="btn-primary" id="btn-start" onclick="iniciarJogo()">
          ⚔ INICIAR MISSÃO
        </button>
      </div>

    </div>

    <!-- Modal de Placar Rápido -->
    <div class="modal-overlay" id="leaderboard-popup" style="display: none;">
      <div class="modal-card">
        <div class="modal-header">
          <h3 class="modal-title">[ PLACAR DA MISSÃO ]</h3>
          <button class="modal-close" onclick="fecharPlacarPopup()">×</button>
        </div>
        <div class="modal-body">
          <div class="mini-leaderboard-list" id="mini-leaderboard-list">
            <div class="leaderboard-loading" style="font-size:7px; text-align:center; padding:10px 0;">⏳ CARREGANDO PLACAR...</div>
          </div>
          <div class="mini-leaderboard-actions" style="margin-top: 16px; text-align: center;">
            <a href="../placar.html" class="btn-primary" style="display: inline-block; text-decoration: none; font-size: 8px; padding: 10px 14px;">🏆 PLACAR COMPLETO</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast de Feedback -->
    <div id="toast" class="toast" role="alert" aria-live="polite"></div>

    <footer class="tavern-footer">
      ⚙ Taberna dos Bits v1.2 · Powered by Supabase
    </footer>

  </main>

  <!-- CDNs e Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../supabaseClient.js?v=2"></script>
  <script src="missao1.js?v=2"></script>
</body>
</html>
