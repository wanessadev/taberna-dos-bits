<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forja do Herói | Taberna dos Bits</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="heroi.css" />
</head>
<body>
  <div class="bg-pixels" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>

  <main class="guild-container">
    <header class="guild-header">
      <div>
        <p class="mini-title">⚔ TABERNA DOS BITS</p>
        <h1>Quadro de Missões</h1>
        <p id="user-info" class="user-info">Carregando aventureiro...</p>
      </div>
      <button class="btn-danger" id="logout-btn">Sair</button>
    </header>

    <section class="panel">
      <h2 id="form-title">Nova missão</h2>
      <p class="panel-text">
        Cadastre uma missão e anexe um arquivo, imagem, brasão ou pergaminho digital.
      </p>

      <form id="mission-form">
        <input type="hidden" id="mission-id" />

        <div class="field-group">
          <label for="titulo">Título da missão</label>
          <input class="pixel-input" id="titulo" type="text" placeholder="Ex: Explorar a masmorra do CSS" required />
        </div>

        <div class="field-group">
          <label for="descricao">Descrição</label>
          <textarea class="pixel-input pixel-textarea" id="descricao" placeholder="Descreva a missão..."></textarea>
        </div>

        <div class="field-group">
          <label for="dificuldade">Dificuldade</label>
          <select class="pixel-input" id="dificuldade">
            <option value="Fácil">Fácil</option>
            <option value="Normal" selected>Normal</option>
            <option value="Difícil">Difícil</option>
            <option value="Épica">Épica</option>
          </select>
        </div>

        <div class="field-group">
          <label for="arquivo">Arquivo da missão</label>
          <input class="pixel-input" id="arquivo" type="file" accept="image/*,.pdf,.doc,.docx" />
          <small>Opcional. Serve para demonstrar o Storage do Supabase.</small>
        </div>

        <div class="button-row">
          <button class="btn-primary" type="submit" id="save-btn">Salvar missão</button>
          <button class="btn-secondary" type="button" id="cancel-edit-btn">Cancelar edição</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>Missões cadastradas</h2>
      <div id="missions-list" class="missions-list">
        <p class="empty-message">Carregando missões...</p>
      </div>
    </section>

    <div id="toast" class="toast" role="alert" aria-live="polite"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="heroi.js"></script>
</body>
</html>
